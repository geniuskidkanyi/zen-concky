-- zen-conky — launch via ./start.sh, which locates the ScreenPad Plus and
-- exports its geometry as ZEN_X / ZEN_Y / ZEN_W / ZEN_H.

local function env(k, d)
    local v = os.getenv(k)
    if v and v ~= '' then return v end
    return d
end

local dir = env('ZEN_DIR', (debug.getinfo(1, 'S').source:match('^@(.*)/') or '.'))
local W, H = tonumber(env('ZEN_W', 2880)), tonumber(env('ZEN_H', 864))

conky.config = {
    out_to_x = true,
    out_to_console = false,
    background = false,
    double_buffer = true,
    update_interval = tonumber(env('ZEN_INTERVAL', 0.5)), -- redraw rate; data samples once per second
    total_run_times = 0,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    top_cpu_separate = false,
    short_units = true,

    own_window = true,
    own_window_class = 'zen-conky',
    own_window_title = 'zen-conky',
    own_window_type = env('ZEN_WINDOW_TYPE', 'normal'),
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#00000000', -- #AARRGGBB; alpha 0 = fully transparent

    alignment = 'top_left',
    gap_x = tonumber(env('ZEN_X', 0)),
    gap_y = tonumber(env('ZEN_Y', 1200)),
    minimum_width = W,
    maximum_width = W,
    minimum_height = H,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    border_width = 0,
    border_inner_margin = 0,
    border_outer_margin = 0,
    use_xft = true,
    font = 'Noto Sans:size=10',

    lua_load = dir .. '/lua/main.lua',
    lua_draw_hook_post = 'conky_zen_main',
    lua_mouse_hook = 'conky_zen_mouse',
    lua_shutdown_hook = 'conky_zen_cleanup',
}

conky.text = [[]]
